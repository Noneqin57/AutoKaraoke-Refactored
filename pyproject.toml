[project]
name = "autokaraoke-refactored"
version = "0.1.0"
description = "Whisper-based word-level LRC generator (AutoKaraoke Refactored)"
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.4.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "stable-ts>=2.1.0",
    "openai-whisper>=20231117",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
